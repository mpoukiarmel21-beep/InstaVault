name: Build Whamrando IPA

on:
  push:
    branches: [feature/*]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install xcodegen
      run: brew install xcodegen
    - name: Generate Xcode project
      run: cd App && xcodegen
    - name: Build IPA
      run: |
        xcodebuild \
          -project App/Whamrando.xcodeproj \
          -scheme Whamrando \
          -configuration Release \
          -destination "generic/platform=iOS" \
          -archivePath $GITHUB_WORKSPACE/build/Whamrando.xcarchive \
          archive CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM=""
    - name: Export IPA
      run: |
        mkdir -p $GITHUB_WORKSPACE/output
        cat > /tmp/expopt.plist << 'EOF'
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>debugging</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string></string>
            <key>compileBitcode</key>
            <false/>
            <key>teamId</key>
            <string></string>
        </dict>
        </plist>
        EOF
        xcodebuild -exportArchive -archivePath $GITHUB_WORKSPACE/build/Whamrando.xcarchive -exportPath $GITHUB_WORKSPACE/output -exportOptionsPlist /tmp/expopt.plist
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Whamrando.ipa
        path: $GITHUB_WORKSPACE/output/*.ipa
