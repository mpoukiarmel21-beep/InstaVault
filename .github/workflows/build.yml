name: Build InstaVault IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Direct download URL for Instagram IPA'
        required: true
        type: string

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=~/theos
          if [ ! -d "$THEOS" ]; then
            git clone --recursive https://github.com/theos/theos.git $THEOS
          fi
          if [ ! -d "$THEOS/sdks/master" ]; then
            curl -LO https://github.com/theos/sdks/archive/master.tar.gz
            tar -xzf master.tar.gz -C $THEOS/sdks/ --strip-components=1
          fi
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH
          brew install ldid optool 2>/dev/null || true

      - name: Build Dylib
        run: |
          export PATH="$THEOS/bin:$PATH"
          cd Tweak
          make clean all
          echo "=== Built files ==="
          find .theos/obj -name "*.dylib" -type f

      - name: Download IPA
        run: |
          curl -L -o Input.ipa "${{ inputs.ipa_url }}" --connect-timeout 30 --max-time 300
          ls -lh Input.ipa

      - name: Inject & Package IPA
        run: |
          export PATH="$THEOS/bin:$PATH"
          DYLIB=$(find Tweak/.theos/obj -name "*.dylib" -type f | head -1)
          echo "Dylib: $DYLIB"
          
          WORKDIR=$(mktemp -d)
          cd "$WORKDIR"
          
          echo "[1/5] Extracting IPA..."
          unzip -q "$GITHUB_WORKSPACE/Input.ipa"
          
          APP=$(ls -d Payload/*.app | head -1)
          echo "App: $APP"
          
          echo "[2/5] Copying dylib..."
          mkdir -p "$APP/Frameworks"
          cp "$GITHUB_WORKSPACE/$DYLIB" "$APP/Frameworks/InstaVault.dylib"
          
          echo "[3/5] Injecting load command..."
          optool install -c load -p @executable_path/Frameworks/InstaVault.dylib -t "$APP/Instagram"
          
          echo "[4/5] Signing..."
          ldid -S "$APP/Instagram"
          
          echo "[5/5] Creating IPA..."
          zip -r -q "$GITHUB_WORKSPACE/InstaVault.ipa" Payload/
          
          echo "=== Done ==="
          ls -lh "$GITHUB_WORKSPACE/InstaVault.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: InstaVault-IPA
          path: InstaVault.ipa
          retention-days: 30
