name: Build InstaVault IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Release tag (e.g. v1.0-ipa), direct URL, or Gofile folder code'
        required: true
        type: string

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=~/theos
          if [ ! -d "$THEOS" ]; then
            git clone --recursive https://github.com/theos/theos.git $THEOS
          fi
          if [ ! -d "$THEOS/sdks/master" ]; then
            curl -LO https://github.com/theos/sdks/archive/master.tar.gz
            tar -xzf master.tar.gz -C $THEOS/sdks/ --strip-components=1
          fi
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH
          echo "$(brew --prefix)/bin" >> $GITHUB_PATH
          brew install ldid
          brew install insert-dylib 2>/dev/null || true

      - name: Build Dylib
        run: |
          export PATH="$THEOS/bin:$PATH"
          cd Tweak
          make clean all
          echo "=== Built files ==="
          find .theos/obj -name "*.dylib" -type f

      - name: Download IPA
        run: |
          IPA_URL="${{ inputs.ipa_url }}"
          if [[ "$IPA_URL" == *gofile.io* ]]; then
            # Gofile: extract folder code and use Python downloader
            FOLDER_CODE=$(echo "$IPA_URL" | sed 's|.*/d/||' | sed 's|/.*||')
            python3 "$GITHUB_WORKSPACE/Tweak/download_gofile.py" "$FOLDER_CODE"
          elif [[ "$IPA_URL" == http* ]]; then
            # Direct URL
            echo "Downloading IPA from: $IPA_URL"
            curl -L -o Input.ipa "$IPA_URL" --connect-timeout 30 --max-time 600
          else
            # Try as GitHub release asset from this repo
            echo "Trying GitHub release: $IPA_URL"
            gh release download "$IPA_URL" --pattern "*.ipa" -D . 2>/dev/null \
              || curl -L -o Input.ipa "https://github.com/mpoukiarmel21-beep/InstaVault/releases/download/$IPA_URL/com.burbn.instagram_442.0.0_und3fined.ipa" --connect-timeout 30 --max-time 600
          fi
          ls -lh Input.ipa

      - name: Inject & Package IPA
        run: |
          export PATH="$THEOS/bin:$PATH"
          DYLIB=$(find Tweak/.theos/obj -name "*.dylib" -type f | head -1)
          echo "Dylib: $DYLIB"

          WORKDIR=$(mktemp -d)
          cd "$WORKDIR"

          echo "[1/5] Extracting IPA..."
          unzip -q "$GITHUB_WORKSPACE/Input.ipa"

          APP=$(ls -d Payload/*.app | head -1)
          echo "App: $APP"

          echo "[2/5] Copying dylib..."
          mkdir -p "$APP/Frameworks"
          cp "$GITHUB_WORKSPACE/$DYLIB" "$APP/Frameworks/InstaVault.dylib"

          echo "[3/5] Injecting load command..."
          if command -v insert_dylib &>/dev/null; then
            echo "Using insert_dylib..."
            insert_dylib --strip-codesig --inplace "@executable_path/Frameworks/InstaVault.dylib" "$APP/Instagram"
          else
            echo "Using Python fallback..."
            python3 "$GITHUB_WORKSPACE/Tweak/inject_dylib.py" "$APP/Instagram" "@executable_path/Frameworks/InstaVault.dylib"
          fi

          echo "[4/5] Signing..."
          ldid -S "$APP/Instagram"

          echo "[5/5] Creating IPA..."
          zip -r -q "$GITHUB_WORKSPACE/InstaVault.ipa" Payload/

          echo "=== Done ==="
          ls -lh "$GITHUB_WORKSPACE/InstaVault.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: InstaVault-IPA
          path: InstaVault.ipa
          retention-days: 30
