name: Build Whamrando IPA

on:
  push:
    branches: [feature/*]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install xcodegen
      run: brew install xcodegen
    - name: Run SPM tests
      run: swift test
    - name: Generate Xcode project
      run: cd App && xcodegen
    - name: Build IPA
      run: |
        xcodebuild \
          -project App/Whamrando.xcodeproj \
          -scheme Whamrando \
          -configuration Release \
          -destination "generic/platform=iOS" \
          -archivePath $GITHUB_WORKSPACE/build/Whamrando.xcarchive \
          archive CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO DEVELOPMENT_TEAM=""
    - name: Export IPA
      run: |
        mkdir -p $GITHUB_WORKSPACE/output
        # Xcode 26's -exportArchive requires a development team for code signing.
        # For ad-hoc builds without an Apple ID, extract the .app bundle from
        # the archive and repackage as .ipa directly.
        APP_PATH=$(find $GITHUB_WORKSPACE/build/Whamrando.xcarchive -name "Whamrando.app" -type d | head -1)
        echo "Found app at: $APP_PATH"
        mkdir -p $GITHUB_WORKSPACE/output/Payload
        cp -r "$APP_PATH" $GITHUB_WORKSPACE/output/Payload/
        cd $GITHUB_WORKSPACE/output
        # codesign ad-hoc to strip any existing signature
        codesign --force --sign - Payload/Whamrando.app
        # Create the IPA (zip the Payload directory)
        zip -r -q $GITHUB_WORKSPACE/output/Whamrando.ipa Payload/
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Whamrando.ipa
        path: ${{ github.workspace }}/output/Whamrando.ipa
        if-no-files-found: error
    - name: Publish release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cd $GITHUB_WORKSPACE/output
        SHA=$(echo ${{ github.sha }} | cut -c1-7)
        gh release create "whamrando-$SHA" Whamrando.ipa \
          --title "Whamrando $SHA" \
          --notes "Build automatique de ${{ github.ref_name }} (sha $SHA). IPA ad-hoc, installable via Sideloadly." \
          --repo ${{ github.repository }} || \
        gh release upload "whamrando-$SHA" Whamrando.ipa \
          --repo ${{ github.repository }} --clobber
