name: Build InstaVault

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=~/theos
          if [ ! -d "$THEOS" ]; then
            git clone --recursive https://github.com/theos/theos.git $THEOS
          fi
          if [ ! -d "$THEOS/sdks/master" ]; then
            curl -LO https://github.com/theos/sdks/archive/master.tar.gz
            tar -xzf master.tar.gz -C $THEOS/sdks/ --strip-components=1
          fi
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH
          brew install ldid 2>/dev/null || true

      - name: Build Dylib
        run: |
          export PATH="$THEOS/bin:$PATH"
          cd Tweak
          make clean all
          echo "=== Built files ==="
          find .theos/obj -name "*.dylib" -type f

      - name: Package
        run: |
          mkdir -p dist
          cp Tweak/obj/*.dylib dist/
          cp Scripts/build_ipa.sh dist/
          chmod +x dist/build_ipa.sh
          cd dist
          zip -j ../InstaVault-dylib.zip *

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: InstaVault-dylib
          path: InstaVault-dylib.zip
          retention-days: 30
