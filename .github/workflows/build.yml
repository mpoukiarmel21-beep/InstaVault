name: Build Whamrando IPA

on:
  push:
    branches: [feature/*]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install xcodegen
      run: brew install xcodegen
    - name: Generate Xcode project
      run: cd App && xcodegen
    - name: Build IPA
      run: |
        xcodebuild \
          -project App/Whamrando.xcodeproj \
          -scheme Whamrando \
          -configuration Release \
          -destination "generic/platform=iPhone" \
          -archivePath $GITHUB_WORKSPACE/build/Whamrando.xcarchive \
          archive CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM=""
    - name: Export IPA
      run: |
        mkdir -p $GITHUB_WORKSPACE/output
        printf "%s" "<plist><dict><key>method</key><string>developer</string><key>compileBitcode</key><false/></dict></plist>" > /tmp/expopt.plist
        xcodebuild -exportArchive -archivePath $GITHUB_WORKSPACE/build/Whamrando.xcarchive -exportPath $GITHUB_WORKSPACE/output -exportOptionsPlist /tmp/expopt.plist
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: Whamrando.ipa
        path: $GITHUB_WORKSPACE/output/*.ipa
