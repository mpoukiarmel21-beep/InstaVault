name: Build InstaVault IPA

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Gofile folder code or full URL (e.g. fx7cdTzC or https://gofile.io/d/fx7cdTzC)'
        required: true
        type: string

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=~/theos
          if [ ! -d "$THEOS" ]; then
            git clone --recursive https://github.com/theos/theos.git $THEOS
          fi
          if [ ! -d "$THEOS/sdks/master" ]; then
            curl -LO https://github.com/theos/sdks/archive/master.tar.gz
            tar -xzf master.tar.gz -C $THEOS/sdks/ --strip-components=1
          fi
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH
          echo "$(brew --prefix)/bin" >> $GITHUB_PATH
          brew install ldid optool

      - name: Build Dylib
        run: |
          export PATH="$THEOS/bin:$PATH"
          cd Tweak
          make clean all
          echo "=== Built files ==="
          find .theos/obj -name "*.dylib" -type f

      - name: Download IPA from Gofile
        run: |
          echo "Getting gofile guest token..."
          GUEST_TOKEN=$(curl -s "https://api.gofile.io/guestToken" | python3 -c "import sys,json; print(json.load(sys.stdin)['data']['guestToken'])")
          echo "Token: ${GUEST_TOKEN:0:8}..."
          
          FOLDER_CODE="${{ inputs.ipa_url }}"
          # Extract folder code from full URL if needed
          if [[ "$FOLDER_CODE" == *gofile.io* ]]; then
            FOLDER_CODE=$(echo "$FOLDER_CODE" | sed 's|.*/d/||' | sed 's|/.*||')
          fi
          echo "Folder code: $FOLDER_CODE"
          
          echo "Getting file info..."
          CONTENT_INFO=$(curl -s "https://api.gofile.io/contents/$FOLDER_CODE" \
            -H "Authorization: Bearer $GUEST_TOKEN")
          echo "$CONTENT_INFO" | python3 -c "import sys,json; d=json.load(sys.stdin); print('Status:', d.get('status')); print('Contents:', len(d.get('data',{}).get('contents',{})))"
          
          # Extract download link - find the IPA file
          DL_URL=$(echo "$CONTENT_INFO" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          contents = d['data']['contents']
          for cid, c in contents.items():
              if c['name'].endswith('.ipa') or c['mimetype'] == 'application/zip':
                  print(c['link'])
                  break
          ")
          echo "Download URL: $DL_URL"
          
          echo "Downloading IPA..."
          curl -L -o Input.ipa "$DL_URL" --connect-timeout 30 --max-time 600
          ls -lh Input.ipa

      - name: Inject & Package IPA
        run: |
          export PATH="$THEOS/bin:$PATH"
          DYLIB=$(find Tweak/.theos/obj -name "*.dylib" -type f | head -1)
          echo "Dylib: $DYLIB"
          
          WORKDIR=$(mktemp -d)
          cd "$WORKDIR"
          
          echo "[1/5] Extracting IPA..."
          unzip -q "$GITHUB_WORKSPACE/Input.ipa"
          
          APP=$(ls -d Payload/*.app | head -1)
          echo "App: $APP"
          
          echo "[2/5] Copying dylib..."
          mkdir -p "$APP/Frameworks"
          cp "$GITHUB_WORKSPACE/$DYLIB" "$APP/Frameworks/InstaVault.dylib"
          
          echo "[3/5] Injecting load command..."
          optool install -c load -p @executable_path/Frameworks/InstaVault.dylib -t "$APP/Instagram"
          
          echo "[4/5] Signing..."
          ldid -S "$APP/Instagram"
          
          echo "[5/5] Creating IPA..."
          zip -r -q "$GITHUB_WORKSPACE/InstaVault.ipa" Payload/
          
          echo "=== Done ==="
          ls -lh "$GITHUB_WORKSPACE/InstaVault.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: InstaVault-IPA
          path: InstaVault.ipa
          retention-days: 30
